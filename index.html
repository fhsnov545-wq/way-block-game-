<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Way Block 3D Clone</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .info {
      margin-top: 15px;
      font-size: 16px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h2>Way Block (Izometrik)</h2>
  <canvas id="gameCanvas" width="360" height="420"></canvas>
  <div class="info">Blokların üzərinə vuraraq onları döndərin və yolu birləşdirin!</div>

  <script src="script.js"></script>
</body>
</html>
