<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Way Block Clone</title>
  <style>
    body {
      margin: 0;
      background-color: #121214;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }
    canvas {
      background-color: #1e1e24;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }
    .status {
      margin-top: 15px;
      font-size: 18px;
      color: #00e676;
    }
  </style>
</head>
<body>

  <h1>Way Block Clone</h1>
  <canvas id="gameCanvas" width="360" height="360"></canvas>
  <div class="status" id="statusText">Mavi fiquru hədəfə çatdırın!</div>

  <script src="script.js"></script>
</body>
</html>
